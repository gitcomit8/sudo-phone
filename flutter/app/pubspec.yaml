name: phone_auth_app
description: Phone auth — biometric sudo via BLE
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # BLE
  flutter_blue_plus: ^1.35.0
  # Biometric auth
  local_auth: ^2.3.0
  # Crypto
  pointycastle: ^3.9.0
  crypto: ^3.0.0
  # Serialization
  json_annotation: ^4.9.0
  # State management
  provider: ^6.1.2
  # UI
  flutter_rust_bridge: 2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
